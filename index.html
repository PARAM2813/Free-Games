<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#070b14;
    color:white;
}

header{
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0d1424;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#60a5fa;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.blue{background:#2563eb}
.green{background:#059669}
.purple{background:#7c3aed}
.red{background:#dc2626}
.gray{background:#475569}

.hero{
    text-align:center;
    padding:65px 20px 35px;
}

.hero h1{
    font-size:clamp(45px,8vw,80px);
    margin:0;
    background:linear-gradient(90deg,#60a5fa,#a78bfa,#34d399);
    color:transparent;
    background-clip:text;
}

.hero p{
    color:#94a3b8;
}

.search{
    max-width:700px;
    margin:auto;
    padding:0 20px 35px;
}

.search input,
.field input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #334155;
    background:#020617;
    color:white;
    font-size:15px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 22px 60px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.count{
    color:#64748b;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.game{
    background:#111827;
    border:1px solid #ffffff12;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.game:hover{
    transform:translateY(-5px);
}

.game-picture{
    height:170px;
    background:#020617;
    cursor:pointer;
}

.game-picture img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-info{
    padding:14px;
}

.game-name{
    font-weight:bold;
    cursor:pointer;
}

.added-by{
    color:#64748b;
    font-size:12px;
    margin-top:6px;
}

.empty{
    text-align:center;
    padding:60px;
    color:#64748b;
    border:1px dashed #334155;
    border-radius:15px;
}

.status{
    text-align:center;
    color:#34d399;
    min-height:20px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111827;
    padding:25px;
    border-radius:18px;
}

.field{
    margin:15px 0;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.mode-buttons{
    display:flex;
    gap:10px;
    margin:15px 0;
}

.mode-button{
    flex:1;
    background:#1e293b;
}

.mode-button.selected{
    background:#2563eb;
}

.actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-top:20px;
}

.admin-game{
    background:#020617;
    padding:12px;
    border-radius:10px;
    margin:10px 0;
}

.admin-game small{
    display:block;
    color:#64748b;
    margin:5px 0 10px;
}

hr{
    border:0;
    border-top:1px solid #334155;
    margin:25px 0;
}

@media(max-width:600px){
    header{
        padding:12px;
    }

    .logo{
        font-size:20px;
    }

    .games{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .game-picture{
        height:125px;
    }

    .game-info{
        padding:10px;
    }

    .game-name{
        font-size:14px;
    }

    header button{
        padding:8px 10px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 <span>GameZone</span></div>

    <div>
        <button class="green" onclick="openModal('userLogin')">
            👤 Login
        </button>

        <button class="purple" onclick="openModal('adminLogin')">
            🔐 Admin
        </button>
    </div>
</header>


<section class="hero">
    <h1>PLAY FREE.</h1>
    <p>Add games by URL or upload your own HTML game.</p>
</section>


<div class="search">
    <input
        id="searchInput"
        type="text"
        placeholder="🔎 Search games..."
        oninput="renderGames()"
    >
</div>

<div id="status" class="status"></div>


<main class="container">

    <div class="heading">
        <h2>🎮 All Games</h2>
        <span id="gameCount" class="count">0 games</span>
    </div>

    <br>

    <div id="gamesContainer" class="games"></div>

    <div id="emptyMessage" class="empty">
        🎮<br><br>
        No games have been added yet.
    </div>

</main>


<!-- USER LOGIN -->

<div class="modal" id="userLogin">

    <div class="modal-box">

        <h2>👤 User Login</h2>

        <div class="field">
            <label>Username</label>
            <input id="username">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="password" type="password">
        </div>

        <div class="actions">

            <button class="blue" onclick="loginUser()">
                Login
            </button>

            <button class="gray" onclick="closeModal('userLogin')">
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- ADMIN LOGIN -->

<div class="modal" id="adminLogin">

    <div class="modal-box">

        <h2>🔐 Admin Login</h2>

        <div class="field">
            <label>Admin Code</label>
            <input id="adminCode" type="password">
        </div>

        <div class="actions">

            <button class="purple" onclick="loginAdmin()">
                Unlock
            </button>

            <button class="gray" onclick="closeModal('adminLogin')">
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- USER ADD GAME -->

<div class="modal" id="userAddGame">

    <div class="modal-box">

        <h2>➕ Add Game</h2>

        <!-- THESE ARE THE TWO OPTIONS -->

        <div class="mode-buttons">

            <button
                id="userUrlButton"
                class="mode-button selected"
                onclick="selectUserMode('url')">
                🔗 Game URL
            </button>

            <button
                id="userFileButton"
                class="mode-button"
                onclick="selectUserMode('file')">
                📁 Game File
            </button>

        </div>


        <div class="field">

            <label>Game Name</label>

            <input
                id="userGameName"
                placeholder="Enter game name"
            >

        </div>


        <!-- URL OPTION -->

        <div id="userUrlSection">

            <div class="field">

                <label>Game URL</label>

                <input
                    id="userGameURL"
                    type="url"
                    placeholder="https://example.com/game"
                >

            </div>

        </div>


        <!-- FILE OPTION -->

        <div
            id="userFileSection"
            style="display:none;">

            <div class="field">

                <label>Game HTML File</label>

                <input
                    id="userGameFile"
                    type="file"
                    accept=".html,.htm"
                >

            </div>

        </div>


        <div class="field">

            <label>Game Picture</label>

            <input
                id="userGamePicture"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="actions">

            <button class="green" onclick="addUserGame()">
                ➕ Add Game
            </button>

            <button
                class="gray"
                onclick="closeModal('userAddGame')">
                Close
            </button>

        </div>

    </div>

</div>


<!-- ADMIN PANEL -->

<div class="modal" id="adminPanel">

    <div class="modal-box">

        <h2>⚙️ Admin Panel</h2>


        <div class="mode-buttons">

            <button
                id="adminUrlButton"
                class="mode-button selected"
                onclick="selectAdminMode('url')">
                🔗 Game URL
            </button>

            <button
                id="adminFileButton"
                class="mode-button"
                onclick="selectAdminMode('file')">
                📁 Game File
            </button>

        </div>


        <div class="field">

            <label>Game Name</label>

            <input
                id="adminGameName"
                placeholder="Enter game name"
            >

        </div>


        <!-- ADMIN URL -->

        <div id="adminUrlSection">

            <div class="field">

                <label>Game URL</label>

                <input
                    id="adminGameURL"
                    type="url"
                    placeholder="https://example.com/game"
                >

            </div>

        </div>


        <!-- ADMIN FILE -->

        <div
            id="adminFileSection"
            style="display:none;">

            <div class="field">

                <label>Game HTML File</label>

                <input
                    id="adminGameFile"
                    type="file"
                    accept=".html,.htm"
                >

            </div>

        </div>


        <div class="field">

            <label>Game Picture</label>

            <input
                id="adminGamePicture"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="actions">

            <button class="blue" onclick="addAdminGame()">
                ➕ Add Game
            </button>

            <button
                class="gray"
                onclick="closeModal('adminPanel')">
                Close
            </button>

        </div>


        <hr>

        <h3>🗑️ Manage Games</h3>

        <div id="adminGames"></div>

    </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://wrmqzkgfdffdyalkuxrk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YYPmntWwTY4WFf-e8qW28g_dhZvy7GR";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   LOGIN
============================== */

const ADMIN_CODE = "PARAM";

const USERNAME = "PARAM1";

const PASSWORD = "GOD";


let games = [];

let userLoggedIn = false;

let adminLoggedIn = false;

let userMode = "url";

let adminMode = "url";


/* ==============================
   MODALS
============================== */

function openModal(id){

    document.getElementById(id).style.display =
        "flex";

}

function closeModal(id){

    document.getElementById(id).style.display =
        "none";

}


/* ==============================
   USER MODE
============================== */

function selectUserMode(mode){

    userMode = mode;


    document
        .getElementById("userUrlButton")
        .classList.toggle(
            "selected",
            mode === "url"
        );


    document
        .getElementById("userFileButton")
        .classList.toggle(
            "selected",
            mode === "file"
        );


    document
        .getElementById("userUrlSection")
        .style.display =
            mode === "url"
            ? "block"
            : "none";


    document
        .getElementById("userFileSection")
        .style.display =
            mode === "file"
            ? "block"
            : "none";

}


/* ==============================
   ADMIN MODE
============================== */

function selectAdminMode(mode){

    adminMode = mode;


    document
        .getElementById("adminUrlButton")
        .classList.toggle(
            "selected",
            mode === "url"
        );


    document
        .getElementById("adminFileButton")
        .classList.toggle(
            "selected",
            mode === "file"
        );


    document
        .getElementById("adminUrlSection")
        .style.display =
            mode === "url"
            ? "block"
            : "none";


    document
        .getElementById("adminFileSection")
        .style.display =
            mode === "file"
            ? "block"
            : "none";

}


/* ==============================
   USER LOGIN
============================== */

function loginUser(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if(
        username === USERNAME &&
        password === PASSWORD
    ){

        userLoggedIn = true;

        closeModal("userLogin");

        openModal("userAddGame");

    }
    else{

        alert(
            "Wrong username or password."
        );

    }

}


/* ==============================
   ADMIN LOGIN
============================== */

function loginAdmin(){

    const code =
        document.getElementById("adminCode").value;


    if(code === ADMIN_CODE){

        adminLoggedIn = true;

        closeModal("adminLogin");

        openModal("adminPanel");

        renderAdminGames();

    }
    else{

        alert("Wrong admin code.");

    }

}


/* ==============================
   LOAD GAMES
============================== */

async function loadGames(){

    const result =
        await supabaseClient
        .from("games")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );


    if(result.error){

        console.error(result.error);

        document.getElementById("status")
        .textContent =
            "Could not load games: " +
            result.error.message;

        return;

    }


    games = result.data || [];

    renderGames();

    renderAdminGames();

}


/* ==============================
   DISPLAY GAMES
============================== */

function renderGames(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const list =
        games.filter(game =>
            (game.name || "")
            .toLowerCase()
            .includes(search)
        );


    document.getElementById("gameCount")
        .textContent =
            list.length +
            (list.length === 1
                ? " game"
                : " games");


    const container =
        document.getElementById(
            "gamesContainer"
        );


    container.innerHTML = "";


    document.getElementById(
        "emptyMessage"
    ).style.display =
        list.length
        ? "none"
        : "block";


    list.forEach(game => {

        const card =
            document.createElement("div");

        card.className = "game";


        const picture =
            document.createElement("div");

        picture.className =
            "game-picture";


        const image =
            document.createElement("img");

        image.src =
            game.image_url;

        image.alt =
            game.name || "Game";


        picture.appendChild(image);


        const info =
            document.createElement("div");

        info.className =
            "game-info";


        const name =
            document.createElement("div");

        name.className =
            "game-name";

        name.textContent =
            game.name || "Unnamed Game";


        const added =
            document.createElement("div");

        added.className =
            "added-by";

        added.textContent =
            "Added by " +
            (game.added_by || "User");


        info.appendChild(name);

        info.appendChild(added);


        card.appendChild(picture);

        card.appendChild(info);


        const openGame = () => {

            if(game.game_url){

                window.open(
                    game.game_url,
                    "_blank"
                );

            }

        };


        picture.onclick = openGame;

        name.onclick = openGame;


        container.appendChild(card);

    });

}


/* ==============================
   UPLOAD IMAGE
============================== */

async function uploadImage(file){

    const path =
        Date.now() +
        "-" +
        Math.random()
        .toString(36)
        .substring(2) +
        "-" +
        file.name.replace(
            /\s+/g,
            "-"
        );


    const result =
        await supabaseClient
        .storage
        .from("game-images")
        .upload(
            path,
            file
        );


    if(result.error){

        throw new Error(
            "Image upload failed: " +
            result.error.message
        );

    }


    const publicURL =
        supabaseClient
        .storage
        .from("game-images")
        .getPublicUrl(path)
        .data
        .publicUrl;


    return {
        path:path,
        url:publicURL
    };

}


/* ==============================
   UPLOAD GAME FILE
============================== */

async function uploadGameFile(file){

    const path =
        Date.now() +
        "-" +
        Math.random()
        .toString(36)
        .substring(2) +
        "-" +
        file.name.replace(
            /\s+/g,
            "-"
        );


    const result =
        await supabaseClient
        .storage
        .from("game-files")
        .upload(
            path,
            file,
            {
                contentType:"text/html"
            }
        );


    if(result.error){

        throw new Error(
            "Game file upload failed: " +
            result.error.message
        );

    }


    const publicURL =
        supabaseClient
        .storage
        .from("game-files")
        .getPublicUrl(path)
        .data
        .publicUrl;


    return {
        path:path,
        url:publicURL
    };

}


/* ==============================
   ADD GAME
============================== */

async function saveGame(
    mode,
    name,
    url,
    imageFile,
    gameFile,
    addedBy
){

    if(!name){

        alert(
            "Please enter the game name."
        );

        return;

    }


    if(!imageFile){

        alert(
            "Please select a game picture."
        );

        return;

    }


    if(
        mode === "url" &&
        !url
    ){

        alert(
            "Please enter the game URL."
        );

        return;

    }


    let gameURL = url;

    let gameFilePath = null;

    let imagePath = null;


    try{

        /* URL MODE */

        if(mode === "url"){

            try{

                new URL(url);

            }
            catch{

                alert(
                    "Please enter a valid URL, for example https://example.com/game"
                );

                return;

            }

        }


        /* FILE MODE */

        if(mode === "file"){

            if(!gameFile){

                alert(
                    "Please select an HTML game file."
                );

                return;

            }


            if(
                !/\.(html|htm)$/i
                .test(gameFile.name)
            ){

                alert(
                    "Please select an HTML file."
                );

                return;

            }


            const uploadedGame =
                await uploadGameFile(
                    gameFile
                );


            gameURL =
                uploadedGame.url;

            gameFilePath =
                uploadedGame.path;

        }


        /* IMAGE */

        const uploadedImage =
            await uploadImage(
                imageFile
            );


        imagePath =
            uploadedImage.path;


        /* DATABASE */

        const result =
            await supabaseClient
            .from("games")
            .insert({

                name:name,

                game_url:gameURL,

                image_url:
                    uploadedImage.url,

                added_by:addedBy,

                game_type:mode,

                game_file_path:
                    gameFilePath

            });


        if(result.error){

            throw new Error(
                "Database error: " +
                result.error.message
            );

        }


        alert(
            "🎉 Game added successfully!"
        );


        await loadGames();


    }
    catch(error){

        console.error(error);

        alert(error.message);


        if(imagePath){

            await supabaseClient
            .storage
            .from("game-images")
            .remove([imagePath]);

        }


        if(gameFilePath){

            await supabaseClient
            .storage
            .from("game-files")
            .remove([gameFilePath]);

        }

    }

}


/* ==============================
   USER ADD
============================== */

async function addUserGame(){

    if(!userLoggedIn){

        alert(
            "Please login first."
        );

        return;

    }


    const name =
        document.getElementById(
            "userGameName"
        ).value.trim();


    const url =
        document.getElementById(
            "userGameURL"
        ).value.trim();


    const image =
        document.getElementById(
            "userGamePicture"
        ).files[0];


    const file =
        document.getElementById(
            "userGameFile"
        ).files[0];


    await saveGame(
        userMode,
        name,
        url,
        image,
        file,
        "User"
    );

}


/* ==============================
   ADMIN ADD
============================== */

async function addAdminGame(){

    if(!adminLoggedIn){

        alert(
            "Admin access required."
        );

        return;

    }


    const name =
        document.getElementById(
            "adminGameName"
        ).value.trim();


    const url =
        document.getElementById(
            "adminGameURL"
        ).value.trim();


    const image =
        document.getElementById(
            "adminGamePicture"
        ).files[0];


    const file =
        document.getElementById(
            "adminGameFile"
        ).files[0];


    await saveGame(
        adminMode,
        name,
        url,
        image,
        file,
        "Admin"
    );

}


/* ==============================
   ADMIN GAME LIST
============================== */

function renderAdminGames(){

    const container =
        document.getElementById(
            "adminGames"
        );


    container.innerHTML = "";


    games.forEach(game => {

        const item =
            document.createElement("div");

        item.className =
            "admin-game";


        const title =
            document.createElement("strong");

        title.textContent =
            game.name || "Unnamed Game";


        const small =
            document.createElement("small");

        small.textContent =
            "Added by " +
            (game.added_by || "User") +
            " • " +
            (
                game.game_type === "file"
                ? "📁 Game File"
                : "🔗 Game URL"
            );


        const button =
            document.createElement("button");

        button.className =
            "red";

        button.textContent =
            "🗑️ Delete";


        button.onclick =
            () => deleteGame(game);


        item.appendChild(title);

        item.appendChild(small);

        item.appendChild(button);


        container.appendChild(item);

    });

}


/* ==============================
   DELETE GAME
============================== */

async function deleteGame(game){

    if(!adminLoggedIn){

        alert(
            "Admin access required."
        );

        return;

    }


    if(
        !confirm(
            'Delete "' +
            game.name +
            '"?'
        )
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("games")
        .delete()
        .eq(
            "id",
            game.id
        );


    if(result.error){

        alert(
            "Delete failed: " +
            result.error.message
        );

        return;

    }


    alert(
        "Game deleted."
    );


    await loadGames();

}


/* ==============================
   CLOSE MODALS
============================== */

window.onclick =
    function(event){

        document
        .querySelectorAll(".modal")
        .forEach(modal => {

            if(event.target === modal){

                modal.style.display =
                    "none";

            }

        });

    };


/* ==============================
   START
============================== */

loadGames();

</script>

</body>
</html>
