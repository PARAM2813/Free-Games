<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameZone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070b14;color:#fff}
header{padding:15px 22px;display:flex;justify-content:space-between;align-items:center;background:#0d1424;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900}.logo span{color:#60a5fa}
button{border:0;border-radius:9px;padding:10px 14px;color:#fff;font-weight:bold;cursor:pointer}
.blue{background:#2563eb}.green{background:#059669}.purple{background:#7c3aed}.red{background:#dc2626}.gray{background:#475569}
.hero{text-align:center;padding:60px 20px 30px}.hero h1{font-size:clamp(45px,8vw,80px);margin:0;background:linear-gradient(90deg,#60a5fa,#a78bfa,#34d399);color:transparent;background-clip:text}.hero p{color:#94a3b8}
.search{max-width:700px;margin:auto;padding:0 20px 30px}.search input,.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-size:15px}
.container{max-width:1200px;margin:auto;padding:0 22px 60px}.heading{display:flex;justify-content:space-between;align-items:center}.count{color:#64748b}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.game{background:#111827;border:1px solid #ffffff12;border-radius:16px;overflow:hidden;transition:.2s}.game:hover{transform:translateY(-4px)}
.game-picture{height:170px;background:#020617;cursor:pointer}.game-picture img{width:100%;height:100%;object-fit:cover}.game-info{padding:14px}.game-name{font-weight:bold;cursor:pointer}.added-by{color:#64748b;font-size:12px;margin-top:6px}
.empty{text-align:center;padding:60px;color:#64748b;border:1px dashed #334155;border-radius:15px}.status{text-align:center;color:#34d399;min-height:20px}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:100;align-items:center;justify-content:center;padding:20px}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#111827;padding:25px;border-radius:18px}
.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-weight:bold}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.admin-game{background:#020617;padding:12px;border-radius:10px;margin:10px 0}.admin-game small{display:block;color:#64748b;margin:5px 0 10px}
hr{border:0;border-top:1px solid #334155;margin:25px 0}
@media(max-width:600px){header{padding:12px}.logo{font-size:20px}header button{padding:8px 10px;font-size:12px}.games{grid-template-columns:repeat(2,1fr);gap:10px}.game-picture{height:125px}.game-info{padding:10px}.game-name{font-size:14px}}
</style>
</head>
<body>
<header><div class="logo">🎮 <span>GameZone</span></div><div><button class="green" onclick="openModal('userLogin')">👤 Login</button> <button class="purple" onclick="openModal('adminLogin')">🔐 Admin</button></div></header>

<section class="hero"><h1>PLAY FREE.</h1><p>Add games using a URL and a picture.</p></section>
<div class="search"><input id="searchInput" placeholder="🔎 Search games..." oninput="renderGames()"></div>
<div id="status" class="status"></div>

<main class="container">
<div class="heading"><h2>🎮 All Games</h2><span id="gameCount" class="count">0 games</span></div><br>
<div id="gamesContainer" class="games"></div>
<div id="emptyMessage" class="empty">🎮<br><br>No games have been added yet.</div>
</main>

<div class="modal" id="userLogin"><div class="modal-box"><h2>👤 User Login</h2>
<div class="field"><label>Username</label><input id="username"></div>
<div class="field"><label>Password</label><input id="password" type="password"></div>
<div class="actions"><button class="blue" onclick="loginUser()">Login</button><button class="gray" onclick="closeModal('userLogin')">Cancel</button></div>
</div></div>

<div class="modal" id="adminLogin"><div class="modal-box"><h2>🔐 Admin Login</h2>
<div class="field"><label>Admin Code</label><input id="adminCode" type="password"></div>
<div class="actions"><button class="purple" onclick="loginAdmin()">Unlock</button><button class="gray" onclick="closeModal('adminLogin')">Cancel</button></div>
</div></div>

<div class="modal" id="addGameModal"><div class="modal-box"><h2>➕ Add Game</h2>
<div class="field"><label>Game Name</label><input id="gameName" placeholder="Enter game name"></div>
<div class="field"><label>Game URL</label><input id="gameURL" type="url" placeholder="https://example.com/game.html"></div>
<div class="field"><label>Game Picture</label><input id="gamePicture" type="file" accept="image/*"></div>
<div class="actions"><button class="green" onclick="addGame()">➕ Add Game</button><button class="gray" onclick="closeModal('addGameModal')">Close</button></div>
</div></div>

<div class="modal" id="adminPanel"><div class="modal-box"><h2>⚙️ Admin Panel</h2>
<div class="field"><label>Game Name</label><input id="adminGameName" placeholder="Enter game name"></div>
<div class="field"><label>Game URL</label><input id="adminGameURL" type="url" placeholder="https://example.com/game.html"></div>
<div class="field"><label>Game Picture</label><input id="adminGamePicture" type="file" accept="image/*"></div>
<div class="actions"><button class="blue" onclick="addAdminGame()">➕ Add Game</button><button class="gray" onclick="closeModal('adminPanel')">Close</button></div>
<hr><h3>🗑️ Manage Games</h3><div id="adminGames"></div>
</div></div>

<script>
const SUPABASE_URL="https://wrmqzkgfdffdyalkuxrk.supabase.co";
const SUPABASE_KEY="sb_publishable_YYPmntWwTY4WFf-e8qW28g_dhZvy7GR";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_CODE="PARAM",USERNAME="PARAM1",PASSWORD="GOD";
let games=[],userLoggedIn=false,adminLoggedIn=false;

function openModal(id){document.getElementById(id).style.display="flex"}
function closeModal(id){document.getElementById(id).style.display="none"}

function loginUser(){
 const u=document.getElementById("username").value,p=document.getElementById("password").value;
 if(u===USERNAME&&p===PASSWORD){userLoggedIn=true;closeModal("userLogin");openModal("addGameModal")}
 else alert("Wrong username or password.");
}
function loginAdmin(){
 const c=document.getElementById("adminCode").value;
 if(c===ADMIN_CODE){adminLoggedIn=true;closeModal("adminLogin");openModal("adminPanel");renderAdminGames()}
 else alert("Wrong admin code.");
}

async function loadGames(){
 const r=await supabaseClient.from("games").select("*").order("created_at",{ascending:false});
 if(r.error){console.error(r.error);document.getElementById("status").textContent="Could not load games: "+r.error.message;return}
 games=r.data||[];renderGames();renderAdminGames();
}

function renderGames(){
 const q=document.getElementById("searchInput").value.toLowerCase();
 const list=games.filter(g=>(g.name||"").toLowerCase().includes(q));
 document.getElementById("gameCount").textContent=list.length+(list.length===1?" game":" games");
 const box=document.getElementById("gamesContainer");box.innerHTML="";
 document.getElementById("emptyMessage").style.display=list.length?"none":"block";
 list.forEach(g=>{
  const card=document.createElement("div");card.className="game";
  const pic=document.createElement("div");pic.className="game-picture";
  const img=document.createElement("img");img.src=g.image_url||"";img.alt=g.name||"Game";pic.appendChild(img);
  const info=document.createElement("div");info.className="game-info";
  const name=document.createElement("div");name.className="game-name";name.textContent=g.name||"Unnamed Game";
  const by=document.createElement("div");by.className="added-by";by.textContent="Added by "+(g.added_by||"User");
  info.append(name,by);card.append(pic,info);
  const openGame=()=>{if(!g.game_url){alert("This game has no URL.");return}const tab=window.open(g.game_url,"_blank","noopener,noreferrer");if(!tab)alert("Please allow pop-ups for this website.")};
  pic.onclick=openGame;name.onclick=openGame;box.appendChild(card);
 });
}

async function uploadImage(file){
 const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+file.name.replace(/\s+/g,"-");
 const r=await supabaseClient.storage.from("game-images").upload(path,file);
 if(r.error)throw new Error("Picture upload failed: "+r.error.message);
 return supabaseClient.storage.from("game-images").getPublicUrl(path).data.publicUrl;
}

async function saveGame(name,url,picture,addedBy){
 if(!name)return alert("Please enter the game name.");
 if(!url)return alert("Please enter the game URL.");
 try{new URL(url)}catch{return alert("Enter a valid URL, for example https://example.com/game.html")}
 if(!picture)return alert("Please choose a game picture.");
 try{
  const imageURL=await uploadImage(picture);
  const r=await supabaseClient.from("games").insert({name:name,game_url:url,image_url:imageURL,added_by:addedBy});
  if(r.error)throw new Error("Database error: "+r.error.message);
  alert("🎉 Game added successfully!");await loadGames();
 }catch(e){console.error(e);alert(e.message)}
}

async function addGame(){
 if(!userLoggedIn)return alert("Please login first.");
 await saveGame(document.getElementById("gameName").value.trim(),document.getElementById("gameURL").value.trim(),document.getElementById("gamePicture").files[0],"User");
}
async function addAdminGame(){
 if(!adminLoggedIn)return alert("Admin access required.");
 await saveGame(document.getElementById("adminGameName").value.trim(),document.getElementById("adminGameURL").value.trim(),document.getElementById("adminGamePicture").files[0],"Admin");
}

function renderAdminGames(){
 const box=document.getElementById("adminGames");box.innerHTML="";
 games.forEach(g=>{
  const item=document.createElement("div");item.className="admin-game";
  const title=document.createElement("strong");title.textContent=g.name||"Unnamed Game";
  const small=document.createElement("small");small.textContent="Added by "+(g.added_by||"User");
  const btn=document.createElement("button");btn.className="red";btn.textContent="🗑️ Delete";btn.onclick=()=>deleteGame(g);
  item.append(title,small,btn);box.appendChild(item);
 });
}

async function deleteGame(g){
 if(!adminLoggedIn)return alert("Admin access required.");
 if(!confirm('Delete "'+g.name+'"?'))return;
 const r=await supabaseClient.from("games").delete().eq("id",g.id);
 if(r.error)return alert("Delete failed: "+r.error.message);
 alert("Game deleted.");await loadGames();
}

window.onclick=e=>document.querySelectorAll(".modal").forEach(m=>{if(e.target===m)m.style.display="none"});
loadGames();
</script>
</body>
</html>
