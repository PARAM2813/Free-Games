<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#05070d;--panel:#0b1020;--panel2:#10172a;--text:#f8fbff;--muted:#8b98ad;--cyan:#00e5ff;--blue:#287bff;--purple:#9b5cff;--pink:#ff3cac;--green:#21e58a;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;background:#05070d;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-30%;z-index:-3;background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.16),transparent 24%),radial-gradient(circle at 80% 15%,rgba(155,92,255,.18),transparent 25%),radial-gradient(circle at 50% 90%,rgba(255,60,172,.10),transparent 28%);animation:aurora 12s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-2;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:55px 55px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
@keyframes aurora{to{transform:translate(3%,2%) scale(1.08)}}
header{position:sticky;top:0;z-index:100;min-height:76px;padding:14px clamp(16px,4vw,60px);display:flex;align-items:center;justify-content:space-between;background:rgba(5,7,13,.72);border-bottom:1px solid rgba(255,255,255,.09);backdrop-filter:blur(24px);box-shadow:0 12px 50px rgba(0,0,0,.35)}
.logo{font-family:Orbitron,sans-serif;font-size:25px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px}.logo:first-letter{filter:drop-shadow(0 0 12px var(--cyan))}.logo span{background:linear-gradient(90deg,#fff,var(--cyan),#8f7cff,var(--pink));background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}@keyframes shine{to{background-position:250%}}
nav{display:flex;gap:10px}button{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 16px;color:#fff;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.2)}button:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.35)}button:active{transform:scale(.97)}
.blue{background:linear-gradient(135deg,#087cff,#3157ff)}.purple{background:linear-gradient(135deg,#783dff,#c13cff)}.green{background:linear-gradient(135deg,#00a96b,#20e58a);color:#03120c}.gray{background:#202a3d}.red{background:linear-gradient(135deg,#e51c4d,#ff405f)}
.hero{position:relative;max-width:1250px;margin:0 auto;padding:95px 24px 58px;text-align:center}.hero:before{content:"";position:absolute;left:50%;top:35px;width:430px;height:180px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,229,255,.18),rgba(155,92,255,.18),rgba(255,60,172,.12));filter:blur(55px);z-index:-1}.hero h1{margin:0;font-family:Orbitron,sans-serif;font-size:clamp(48px,9vw,105px);font-weight:900;line-height:.95;letter-spacing:-3px;background:linear-gradient(100deg,#fff 15%,#00e5ff 42%,#9275ff 68%,#ff58b8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 50px rgba(0,229,255,.12)}.hero p{margin:23px 0 0;color:#aab6c9;font-size:17px;letter-spacing:.4px}
.search{max-width:850px;margin:0 auto 42px;padding:0 22px;position:relative}.search:before{content:"⌕";position:absolute;left:42px;top:50%;transform:translateY(-52%);font-size:23px;color:#00e5ff;z-index:2}.search input{width:100%;height:58px;padding:0 20px 0 52px;border-radius:17px;border:1px solid rgba(0,229,255,.2);background:rgba(11,16,32,.78);color:#fff;font-size:16px;outline:none;box-shadow:0 20px 55px rgba(0,0,0,.3),inset 0 0 25px rgba(0,229,255,.025);transition:.25s}.search input:focus{border-color:rgba(0,229,255,.75);box-shadow:0 0 0 4px rgba(0,229,255,.08),0 20px 55px rgba(0,0,0,.4)}.search input::placeholder{color:#65738a}
.container{max-width:1250px;margin:auto;padding:0 22px 90px}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;padding:17px 20px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(90deg,rgba(13,20,38,.9),rgba(13,18,33,.6));box-shadow:0 14px 40px rgba(0,0,0,.2)}.heading h2{margin:0;font-family:Orbitron,sans-serif;font-size:21px;letter-spacing:.5px}.count{padding:7px 12px;border-radius:999px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.18);color:#7eefff;font-size:12px;font-weight:800}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:25px}.game{position:relative;overflow:hidden;border-radius:21px;background:linear-gradient(145deg,rgba(18,27,49,.95),rgba(7,11,22,.98));border:1px solid rgba(255,255,255,.09);box-shadow:0 16px 45px rgba(0,0,0,.35);transition:transform .3s,box-shadow .3s,border-color .3s}.game:before{content:"";position:absolute;inset:-1px;z-index:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(0,229,255,.35),transparent 35%,rgba(155,92,255,.3),transparent 70%,rgba(255,60,172,.22));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35}.game:hover{transform:translateY(-10px) scale(1.015);border-color:rgba(0,229,255,.35);box-shadow:0 25px 65px rgba(0,0,0,.5),0 0 35px rgba(0,229,255,.08)}
.game-image{height:190px;background:linear-gradient(135deg,#080d19,#121b31);cursor:pointer;overflow:hidden;position:relative}.game-image:before{content:"GAME";position:absolute;left:13px;top:12px;z-index:2;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);font:800 9px Orbitron,sans-serif;letter-spacing:1px;color:#bdefff;backdrop-filter:blur(7px)}.game-image:after{content:"▶  PLAY NOW";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(8px);opacity:0;padding:12px 17px;border-radius:999px;background:rgba(4,8,18,.82);border:1px solid rgba(0,229,255,.55);color:#fff;font:800 11px Orbitron,sans-serif;letter-spacing:1px;transition:.25s;box-shadow:0 0 28px rgba(0,229,255,.18);backdrop-filter:blur(9px)}.game:hover .game-image:after{opacity:1;transform:translate(-50%,-50%) translateY(0)}.game-image img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s;filter:saturate(.95)}.game:hover .game-image img{transform:scale(1.09);filter:saturate(1.25) contrast(1.05) brightness(1.05)}
.info{position:relative;padding:18px 18px 20px}.name{font-family:Orbitron,sans-serif;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name:after{content:"  →";color:#00e5ff}.by{margin-top:9px;color:#66758d;font-size:11px}.by:before{content:"●  ";color:#21e58a}.empty{display:none;text-align:center;padding:90px 20px;color:#718096;border:1px dashed rgba(0,229,255,.2);border-radius:20px;background:rgba(8,13,26,.55)}.status{text-align:center;margin:16px;color:#55f0b1;min-height:20px;font-weight:700}
.modal{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px;backdrop-filter:blur(13px);animation:fade .2s}@keyframes fade{from{opacity:0}to{opacity:1}}.box{position:relative;width:min(520px,100%);max-height:90vh;overflow:auto;padding:31px;border-radius:25px;background:linear-gradient(145deg,#111a30,#080d19);border:1px solid rgba(0,229,255,.18);box-shadow:0 35px 100px rgba(0,0,0,.65),0 0 50px rgba(0,229,255,.06)}.box:before{content:"";position:absolute;left:25px;right:25px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);box-shadow:0 0 18px var(--cyan)}.box h2{margin:0 0 22px;font-family:Orbitron,sans-serif}.field{margin:17px 0}.field label{display:block;font-weight:800;margin-bottom:8px;color:#dce7f5;font-size:13px}.field input{width:100%;padding:14px;border-radius:12px;border:1px solid #2b3b55;background:#050a14;color:#fff;outline:none}.field input:focus{border-color:#00e5ff;box-shadow:0 0 0 3px rgba(0,229,255,.08)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.admin-game{background:#050a14;padding:15px;margin-top:11px;border-radius:13px;border:1px solid rgba(255,255,255,.08)}.admin-game small{display:block;color:#697991;margin:5px 0 10px}hr{border:0;border-top:1px solid rgba(255,255,255,.09);margin:25px 0}
@media(max-width:700px){header{min-height:64px;padding:11px 13px}.logo{font-size:18px}nav{gap:5px}nav button{padding:9px 10px;font-size:11px}.hero{padding:65px 15px 38px}.hero h1{font-size:clamp(40px,15vw,70px);letter-spacing:-2px}.hero p{font-size:13px}.search{padding:0 13px;margin-bottom:28px}.search input{height:52px}.search:before{left:31px}.container{padding:0 13px 60px}.heading{padding:13px 14px}.heading h2{font-size:16px}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{border-radius:15px}.game-image{height:135px}.info{padding:12px}.name{font-size:12px}.by{font-size:9px}.game-image:after{font-size:8px;padding:9px 11px}.box{padding:24px;border-radius:20px}}
</style>
</head>
<body>
<header><div class="logo">🎮 <span>GameZone</span></div><nav>
<button class="green" onclick="openModal('userLogin')">👤 Login</button>
<button class="purple" onclick="openModal('adminLogin')">🔐 Admin</button>
</nav></header>
<section class="hero"><h1>PLAY FREE.</h1><p>Play games uploaded to GameZone.</p></section>
<div class="search"><input id="search" placeholder="🔎 Search games..." oninput="renderGames()"></div>
<div class="status" id="status"></div>
<main class="container">
<div class="heading"><h2>🎮 All Games</h2><span class="count" id="count">0 games</span></div><br>
<div id="games" class="games"></div><div id="empty" class="empty">🎮<br><br>No games have been uploaded yet.</div>
</main>

<div class="modal" id="userLogin"><div class="box"><h2>👤 User Login</h2>
<div class="field"><label>Username</label><input id="username"></div>
<div class="field"><label>Password</label><input id="password" type="password"></div>
<div class="actions"><button class="blue" onclick="userLogin()">Login</button><button class="gray" onclick="closeModal('userLogin')">Cancel</button></div>
</div></div>

<div class="modal" id="adminLogin"><div class="box"><h2>🔐 Admin Panel</h2>
<div class="field"><label>Admin Code</label><input id="adminCode" type="password"></div>
<div class="actions"><button class="purple" onclick="adminLogin()">Unlock</button><button class="gray" onclick="closeModal('adminLogin')">Cancel</button></div>
</div></div>

<div class="modal" id="uploadPanel"><div class="box"><h2>➕ Add Game</h2>
<div class="field"><label>Game Name</label><input id="userGameName" placeholder="Game name"></div>
<div class="field"><label>Game Picture</label><input id="userGameImage" type="file" accept="image/*"></div>
<div class="field"><label>Game File</label><input id="userGameFile" type="file" accept=".html,.htm"></div>
<div class="actions"><button class="green" onclick="uploadUserGame()">Upload Game</button><button class="gray" onclick="closeModal('uploadPanel')">Close</button></div>
</div></div>

<div class="modal" id="adminPanel"><div class="box"><h2>⚙️ Admin Panel</h2>
<div class="field"><label>Game Name</label><input id="adminGameName" placeholder="Game name"></div>
<div class="field"><label>Game Picture</label><input id="adminGameImage" type="file" accept="image/*"></div>
<div class="field"><label>Game File</label><input id="adminGameFile" type="file" accept=".html,.htm"></div>
<div class="actions"><button class="blue" onclick="uploadAdminGame()">➕ Add Game</button><button class="gray" onclick="closeModal('adminPanel')">Close</button></div>
<hr><h3>🗑️ Manage Games</h3><div id="adminGames"></div>
</div></div>

<script>
const SUPABASE_URL="https://wrmqzkgfdffdyalkuxrk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_YYPmntWwTY4WFf-e8qW28g_dhZvy7GR";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ADMIN_CODE="PARAM",USERNAME="PARAM1",PASSWORD="GOD";
let games=[],loggedIn=false,adminMode=false;

async function loadGames(){
 const {data,error}=await supabaseClient.from("games").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);document.getElementById("status").textContent="Could not load games: "+error.message;return}
 games=data||[];renderGames();renderAdminGames();
}
function renderGames(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=games.filter(g=>(g.name||"").toLowerCase().includes(q));
 document.getElementById("count").textContent=list.length+(list.length===1?" game":" games");
 const box=document.getElementById("games");box.innerHTML="";
 document.getElementById("empty").style.display=list.length?"none":"block";
 list.forEach(g=>{
  const card=document.createElement("div");card.className="game";
  const image=document.createElement("div");image.className="game-image";
  const img=document.createElement("img");img.src=g.image_url;img.alt=g.name||"Game";image.appendChild(img);
  const info=document.createElement("div");info.className="info";
  const name=document.createElement("div");name.className="name";name.textContent=g.name||"Unnamed game";
  const by=document.createElement("div");by.className="by";by.textContent="Added by "+(g.added_by||"User");
  info.append(name,by);card.append(image,info);
  image.onclick=()=>window.open(g.game_url,"_blank");name.onclick=()=>window.open(g.game_url,"_blank");
  box.appendChild(card);
 });
}
function userLogin(){
 if(document.getElementById("username").value===USERNAME&&document.getElementById("password").value===PASSWORD){
  loggedIn=true;closeModal("userLogin");openModal("uploadPanel");
 }else alert("Wrong username or password.");
}
function adminLogin(){
 if(document.getElementById("adminCode").value===ADMIN_CODE){
  adminMode=true;closeModal("adminLogin");openModal("adminPanel");
 }else alert("Wrong admin code.");
}
async function uploadUserGame(){if(!loggedIn)return alert("Please login first.");await uploadGame("userGameName","userGameImage","userGameFile","User")}
async function uploadAdminGame(){if(!adminMode)return alert("Admin access required.");await uploadGame("adminGameName","adminGameImage","adminGameFile","Admin")}
async function uploadGame(nameID,imageID,fileID,addedBy){
 const name=document.getElementById(nameID).value.trim(),image=document.getElementById(imageID).files[0],gameFile=document.getElementById(fileID).files[0];
 if(!name||!image||!gameFile)return alert("Please enter the game name and select both files.");
 if(!/\.(html|htm)$/i.test(gameFile.name))return alert("Game file must be HTML.");
 document.getElementById("status").textContent="Uploading game...";
 const unique=Date.now()+"-"+Math.random().toString(36).substring(2);
 const imagePath=unique+"-"+image.name.replace(/\s+/g,"-"),gamePath=unique+"-"+gameFile.name.replace(/\s+/g,"-");
 let r=await supabaseClient.storage.from("game-images").upload(imagePath,image);
 if(r.error)return alert("Image upload failed: "+r.error.message);
 r=await supabaseClient.storage.from("game-files").upload(gamePath,gameFile);
 if(r.error)return alert("Game upload failed: "+r.error.message);
 const imageURL=supabaseClient.storage.from("game-images").getPublicUrl(imagePath).data.publicUrl;
 const gameURL=supabaseClient.storage.from("game-files").getPublicUrl(gamePath).data.publicUrl;
 r=await supabaseClient.from("games").insert({name,image_url:imageURL,game_url:gameURL,added_by:addedBy});
 if(r.error)return alert("Database error: "+r.error.message);
 alert("🎉 Game uploaded successfully!");
 document.getElementById(nameID).value="";document.getElementById(imageID).value="";document.getElementById(fileID).value="";
 closeModal(addedBy==="Admin"?"adminPanel":"uploadPanel");await loadGames();
}
function renderAdminGames(){
 const box=document.getElementById("adminGames");box.innerHTML="";
 games.forEach(g=>{
  const item=document.createElement("div");item.className="admin-game";
  const title=document.createElement("strong");title.textContent=g.name||"Unnamed game";
  const small=document.createElement("small");small.textContent="Added by "+(g.added_by||"User");
  const btn=document.createElement("button");btn.className="red";btn.textContent="🗑️ Delete";btn.onclick=()=>deleteGame(g);
  item.append(title,small,btn);box.appendChild(item);
 });
}
async function deleteGame(game){
 if(!adminMode)return alert("Admin access required.");
 if(!confirm('Delete "'+(game.name||"this game")+'"?'))return;
 let r=await supabaseClient.from("games").delete().eq("id",game.id);
 if(r.error)return alert("Delete failed: "+r.error.message);
 const ip=game.image_url?.split("/game-images/")[1],gp=game.game_url?.split("/game-files/")[1];
 if(ip)await supabaseClient.storage.from("game-images").remove([ip]);
 if(gp)await supabaseClient.storage.from("game-files").remove([gp]);
 await loadGames();alert("Game deleted.");
}
function openModal(id){document.getElementById(id).style.display="flex"}
function closeModal(id){document.getElementById(id).style.display="none"}
window.onclick=e=>document.querySelectorAll(".modal").forEach(m=>{if(e.target===m)m.style.display="none"});
loadGames();
</script>
</body>
</html>
